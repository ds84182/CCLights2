buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        // Maintained fork of ForgeGradle 1.2 that still resolves against today's Forge maven.
        classpath('com.anatawa12.forge:ForgeGradle:1.2-1.1.+') {
            changing = true
        }
    }
}

apply plugin: 'forge'

sourceCompatibility = 1.8
targetCompatibility = 1.8

if (System.getenv().BUILD_NUMBER != null)
    ext.buildNumber = System.getenv().BUILD_NUMBER.toInteger()
else
    ext.buildNumber = 0

version = "${mod_version}.${project.ext.buildNumber}"
group = "ds.mods.CCLights2"
archivesBaseName = "CCLights2-${minecraft_version}"

minecraft {
    version = "${minecraft_version}-${forge_version}"
    runDir = "run"
    replace "@VERSION@", project.version
    replace "@BUILD@", project.ext.buildNumber
}

// The ComputerCraft API is compiled against, but never shipped: the real one comes from the CC jar at runtime.
sourceSets.main.java.srcDir("src/externs/java")

jar {
    exclude 'dan200/**'
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }
}
