// Multi-loader build: common (vanilla + CC: Tweaked common API), fabric and forge (Minecraft 1.20.1).
// The 1.7.10 ForgeGradle build this replaced is still in git history on master; its sources under
// src/ are kept as a porting reference only and are not compiled by this build.
plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom" version "1.17-SNAPSHOT" apply false
    id "com.gradleup.shadow" version "9.2.2" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: "java"
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"

    base {
        // CCLights2-<loader>-1.20.1-<version>.jar
        archivesName = "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version}"
    }

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
        maven {
            name = "SquidDev (CC: Tweaked)"
            url = "https://maven.squiddev.cc"
            content {
                includeGroup("cc.tweaked")
            }
        }
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://maven.architectury.dev/" }
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 17
    }
}
